name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: 测试并编译
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: 运行测试并编译 Windows 项目
        run: dotnet test GameTimeGuard.sln -c Release --nologo

  installer:
    name: 制作安装包
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: 发布免安装运行时的服务
        run: >-
          dotnet publish src/GameTimeGuard.Service/GameTimeGuard.Service.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o artifacts/publish/service

      - name: 发布免安装运行时的托盘程序
        run: >-
          dotnet publish src/GameTimeGuard.Tray/GameTimeGuard.Tray.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o artifacts/publish/tray

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 编译安装包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw "找不到 ISCC.exe。Inno Setup 可能装到了预料之外的目录。" }
          Write-Host "使用 $iscc"
          & $iscc installer\GameTimeGuard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传安装包
        uses: actions/upload-artifact@v7
        with:
          name: GameTimeGuard-Setup
          path: artifacts/installer/*.exe
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/installer/*.exe
          body: |
            这是游戏时间守护的 Windows 安装包，已包含 .NET 运行时，家长不需要另外安装。

            安装时请家长在场并设置密码。孩子需要使用标准用户账户，不能是管理员。
            详细说明见仓库 README。
